<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Status | ABECFX</title>
  <meta name="description" content="Check an ABECFX student's status using their registration number." />
  <meta name="theme-color" content="#5a1060" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="stage">
    <aside class="panel">
      <a class="brandbar" href="/" aria-label="ABECFX home">
        <img src="/logo-white.png" alt="" />
        <span><span class="name">ABECFX</span><span class="tag">Adebass Base Edge Consult</span></span>
      </a>

      <div class="pitch">
        <h1>Check a student's status.</h1>
        <p>See whether a student is certified, a mentor or a member of staff.</p>
      </div>

      <div class="panel-foot">
        <a href="/">New student? Register here</a>
      </div>
    </aside>

    <main class="sheet">
      <div class="sheet-inner">
        <h2>Find a student</h2>
        <p class="lead">Enter the registration number, for example ABECFX/26/0001.</p>

        <form id="lookupForm" novalidate>
          <div class="search">
            <div class="field">
              <label for="reg" class="sr" style="position:absolute;left:-9999px">Registration number</label>
              <input id="reg" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABECFX/26/0001" required />
            </div>
            <button type="submit" id="lookupBtn" class="primary" style="width:auto">Check status</button>
          </div>
          <p class="formErr" id="lookupErr" role="alert" style="margin-top:12px"></p>
        </form>

        <div class="result" id="result" hidden>
          <article class="pass" aria-live="polite">
            <div class="pass-top">
              <div class="pass-brand"><img src="/logo-white.png" alt="" />ABECFX</div>
              <div class="status" id="rBadge"><span id="rStatus"></span></div>
            </div>
            <h3 class="pass-name" id="rName"></h3>
            <p class="pass-reg" id="rReg"></p>
            <dl class="pass-meta">
              <div><dt>Gender</dt><dd id="rGender"></dd></div>
              <div><dt id="rDateLabel">Status since</dt><dd id="rDate"></dd></div>
            </dl>
          </article>
        </div>

        <p class="sheet-foot">&copy; <span id="year"></span> Adebass Base Edge Consult</p>
      </div>
    </main>
  </div>
  <script src="/status.js"></script>
</body>
</html>
